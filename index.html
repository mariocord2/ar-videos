<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR Vídeos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="config.js"></script>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --mut:#6e6e73; --line:#d2d2d7; --field:#f5f5f7; --accent:#0071e3; --accent-h:#0077ed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f5f5f7; --mut:#a1a1a6; --line:#38383a; --field:#1c1c1e; } }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:0 24px; text-align:center; z-index:10; background:var(--bg); }
  #start h1 { margin:0; font-size:clamp(2.2rem,9vw,3.5rem); font-weight:600; letter-spacing:-.03em; line-height:1.05; }
  #msg { margin:0 0 12px; color:var(--mut); font-size:1.1rem; max-width:30ch; min-height:1.4em; }
  form { display:flex; flex-direction:column; gap:10px; width:min(320px,100%); }
  input { font:inherit; font-size:1rem; padding:13px 16px; border-radius:12px; border:1px solid var(--line); background:var(--field); color:var(--fg); }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { font:inherit; font-size:1.05rem; padding:12px 28px; border:0; border-radius:980px; background:var(--accent); color:#fff; cursor:pointer; transition:background .2s; }
  button:hover { background:var(--accent-h); }
  button:active { transform:scale(.98); }
  button:disabled { opacity:.4; }
  .pw { position:relative; display:flex; }
  .pw input { flex:1; padding-right:84px; }
  .pw button.link { position:absolute; right:4px; top:50%; transform:translateY(-50%); padding:6px 12px; font-size:.85rem; }
  button.link { background:transparent; color:var(--accent); font-size:.95rem; padding:8px 16px; }
  #hint { position:fixed; bottom:max(32px,env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:5; pointer-events:none; display:none;
    padding:10px 20px; border-radius:980px; font-size:.95rem; color:#fff; background:rgba(30,30,32,.55); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); white-space:nowrap; }
  #exit { position:fixed; top:max(16px,env(safe-area-inset-top)); right:16px; z-index:6; display:none; padding:8px 16px; font-size:.9rem;
    color:#fff; background:rgba(30,30,32,.55); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); }
</style>
</head>
<body>
<div id="start">
  <h1>Realidade Aumentada</h1>
  <p id="msg">Entre com seu acesso.</p>

  <form id="login">
    <input id="user" placeholder="Login" autocapitalize="none" autocomplete="username" required>
    <div class="pw"><input id="pass" type="password" placeholder="Senha" autocomplete="current-password" required><button type="button" class="link" aria-label="Mostrar ou ocultar a senha">Mostrar</button></div>
    <button id="loginBtn">Entrar</button>
  </form>

  <div id="ready" hidden>
    <button id="go">Abrir câmera</button><br>
    <button class="link" id="logout">Sair</button>
  </div>
</div>
<div id="hint">Aponte a câmera para uma imagem</div>
<button id="exit">Fechar</button>
<div id="root"></div>

<script>
const C = window.AR_CONFIG;
const EMAIL_DOMAIN = "ar.app";
const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY, { auth: { storageKey: "ar-client-session" } });
const $ = id => document.getElementById(id);
let manifest = [], videoUrls = [], mindUrl = "", keepMsg = false;

const toEmail = v => { v = v.trim().toLowerCase(); return v.includes("@") ? v : `${v}@${EMAIL_DOMAIN}`; };

function view(name) {
  $("login").hidden = name !== "login";
  $("ready").hidden = name !== "ready";
}

async function loadContent(session) {
  const cid = session.user.app_metadata?.client_id;
  if (!cid) {
    const adm = session.user.app_metadata?.role === "admin";
    keepMsg = true;
    await sb.auth.signOut();
    $("msg").innerHTML = adm ? 'Esta é a conta de administrador. <a href="admin.html">Abrir o painel</a>.' : "Esta conta não é de cliente.";
    return;
  }
  view("none"); $("msg").textContent = "Carregando…";
  try {
    const st = sb.storage.from(C.BUCKET);
    const j = await st.download(`${cid}/targets.json`);
    if (j.error) throw new Error("vazio");
    manifest = JSON.parse(await j.data.text());
    if (!manifest.length) throw new Error("vazio");
    const m = await st.download(`${cid}/targets.mind`);
    if (m.error) throw m.error;
    mindUrl = URL.createObjectURL(m.data);
    const s = await st.createSignedUrls(manifest.map(t => t.videoPath), 6 * 3600);
    if (s.error) throw s.error;
    videoUrls = s.data.map(x => x.signedUrl);
    $("msg").textContent = `${manifest.length} imagem(ns) disponível(is).`;
    view("ready");
  } catch {
    $("msg").textContent = "Nenhuma imagem cadastrada para este acesso ainda.";
    view("ready"); $("go").hidden = true;
  }
}

$("login").onsubmit = async e => {
  e.preventDefault();
  $("loginBtn").disabled = true;
  const { error } = await sb.auth.signInWithPassword({
    email: toEmail($("user").value), password: $("pass").value });
  $("loginBtn").disabled = false;
  if (error) $("msg").textContent = "Login ou senha incorretos.";
};
// Botão "Mostrar/Ocultar" dos campos de senha.
document.querySelectorAll(".pw button").forEach(b => b.onclick = () => {
  const i = b.parentElement.querySelector("input"), show = i.type === "password";
  i.type = show ? "text" : "password"; b.textContent = show ? "Ocultar" : "Mostrar";
  b.setAttribute("aria-pressed", show);
});

$("logout").onclick = () => sb.auth.signOut();
$("exit").onclick = () => location.reload();

sb.auth.onAuthStateChange((event, session) => {
  if (event === "TOKEN_REFRESHED") return;
  if (!session) { manifest = []; $("go").hidden = false; if (!keepMsg) $("msg").textContent = "Entre com seu acesso."; keepMsg = false; view("login"); return; }
  loadContent(session);
});

$("go").onclick = () => {
  const vids = manifest.map((t, i) =>
    `<video id="v${i}" src="${videoUrls[i]}" crossorigin="anonymous" loop playsinline webkit-playsinline preload="auto"></video>`).join("");
  const ents = manifest.map((t, i) =>
    `<a-entity mindar-image-target="targetIndex: ${i}"><a-video src="#v${i}" width="1" height="${t.aspect}" position="0 0 0.01"></a-video></a-entity>`).join("");
  $("root").innerHTML = `
    <a-scene mindar-image="imageTargetSrc: ${mindUrl}; uiScanning: yes; uiLoading: yes; filterMinCF:0.0001; filterBeta:0.001"
      color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false" embedded style="position:fixed;inset:0">
      <a-assets>${vids}</a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      ${ents}
    </a-scene>`;
  $("start").style.display = "none";
  $("hint").style.display = "block";
  $("exit").style.display = "block";

  // Desbloqueia reprodução (política de autoplay) dentro do gesto do usuário.
  manifest.forEach((_, i) => { const v = $("v" + i); v.play().then(() => v.pause()).catch(() => {}); });

  const scene = document.querySelector("a-scene");
  scene.addEventListener("loaded", () => {
    const ents = scene.querySelectorAll("[mindar-image-target]");
    manifest.forEach((_, i) => {
      const v = $("v" + i);
      ents[i].addEventListener("targetFound", () => { $("hint").style.display = "none"; v.currentTime = 0; v.play(); });
      ents[i].addEventListener("targetLost", () => { v.pause(); $("hint").style.display = "block"; });
    });
  });
};
</script>
</body>
</html>
